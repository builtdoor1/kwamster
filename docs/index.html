						me: { x: sx(self.x), y: sz(self.z) }, opp: { x: sx(opp.x), y: sz(opp.z) },
						angle: Math.atan2(opp.z - self.z, opp.x - self.x)
					};
				},
				meNow: { x: mx, y: mz },
				oppNow: function (i) { return opps[i] ? { x: sx(opps[i].x), y: sz(opps[i].z) } : null; },
				deathAt: function (e) {
					var w = trackAt(e.youDied ? m.selfKeys : (m.oppKeys[e.opp] || []), e.t);
					return w ? { x: sx(w.x), y: sz(w.z) } : null;
				}
			}, r, s);

			// Scale bar.
			var choices = [1, 2, 5, 10, 20], blocks = 1;
			for (var c = 0; c < choices.length; c++) { blocks = choices[c]; if (blocks * s >= 44) break; }
			var bw = blocks * s, by = ch - 14, bx0 = 14;
			ctx.save();
			ctx.strokeStyle = col['--muted'];
			ctx.lineWidth = 1.5;
			ctx.beginPath();
			ctx.moveTo(bx0, by - 4); ctx.lineTo(bx0, by); ctx.lineTo(bx0 + bw, by); ctx.lineTo(bx0 + bw, by - 4);
			ctx.stroke();
			ctx.fillStyle = col['--muted'];
			ctx.font = '500 11px ' + FONT;
			ctx.textBaseline = 'bottom';
			ctx.fillText(blocks + (blocks === 1 ? ' block' : ' blocks'), bx0 + bw + 6, by + 1);
			ctx.restore();
		}

		// No positions: a 1-D view (distance from the reach of each event) above a distance-over-time strip.
		function draw1d(cw, ch) {
			var trackH = Math.round(ch * 0.55);
			var left = Math.max(40, cw * 0.1), right = cw - 24;
			var maxD = 6;
			function dx(dist) { return left + clamp(dist, 0, maxD) / maxD * (right - left); }
			var y = Math.round(trackH * 0.58);
			ctx.strokeStyle = col['--grid5'];
			ctx.lineWidth = 1;
			ctx.beginPath(); ctx.moveTo(left, y + 0.5); ctx.lineTo(right, y + 0.5); ctx.stroke();
			ctx.fillStyle = col['--dim'];
			ctx.font = '500 10.5px ' + FONT;
			ctx.textAlign = 'center';
			ctx.textBaseline = 'top';
			for (var b = 0; b <= maxD; b++) {
				var bx = Math.round(dx(b)) + 0.5;
				ctx.strokeStyle = col['--grid5'];
				ctx.beginPath(); ctx.moveTo(bx, y - 4); ctx.lineTo(bx, y + 4); ctx.stroke();
				ctx.fillText(b + (b === maxD ? '+' : ''), bx, y + 15);
			}
			var thr = m.d.threeBlockCm / 100;
			ctx.save();
			ctx.setLineDash([4, 4]);
			ctx.strokeStyle = col['--accent2'];
			ctx.beginPath(); ctx.moveTo(dx(thr) + 0.5, y - 22); ctx.lineTo(dx(thr) + 0.5, y + 4); ctx.stroke();
			ctx.restore();

			var dNow = trackAt(m.distKeys, t);
			var dist = dNow ? dNow.x : 3;
			var st = m.stateAt(t);
			var r = 9;
			var ox = dx(dist);
			disc(ox, y, r, oppColor(st.opp));
			nameLabel(ox, y - r - 5, oppName(m, st.opp));
			disc(left, y, r, col['--accent']);
			nameLabel(left, y - r - 5, m.d.player || 'You');
			pill((left + ox) / 2, y - 30, blocksText(dist) + ' blocks', PILL_TEXT, 0.95);
			bursts({
				place: function (e) {
					var dd = e.reach != null ? e.reach : dist;
					return { me: { x: left, y: y }, opp: { x: dx(dd), y: y }, angle: 0 };
				},
				meNow: { x: left, y: y },
				oppNow: function () { return { x: ox, y: y }; },
				deathAt: function (e) {
					if (e.youDied) return { x: left, y: y };
					var at = trackAt(m.distKeys, e.t);
					return { x: dx(at ? at.x : dist), y: y };
				}
			}, r, 40);

			// Strip: distance over the whole fight with a playhead.
			var top = trackH + 10, bottom = ch - 22, sl = 40, sr = cw - 16;
			function txp(tt) { return sl + clamp(tt / END, 0, 1) * (sr - sl); }
			function dyp(dd) { return bottom - clamp(dd, 0, maxD) / maxD * (bottom - top); }
			ctx.strokeStyle = col['--grid1'];
			ctx.fillStyle = col['--dim'];
			ctx.textAlign = 'right';
			ctx.textBaseline = 'middle';
			[0, 3, 6].forEach(function (v) {
				var yy = Math.round(dyp(v)) + 0.5;
				ctx.beginPath(); ctx.moveTo(sl, yy); ctx.lineTo(sr, yy); ctx.stroke();
				ctx.fillText(v + ' b', sl - 6, yy);
			});
			if (m.distKeys.length) {
				ctx.strokeStyle = col['--muted'];
				ctx.globalAlpha = 0.6;
				ctx.lineWidth = 1.5;
				ctx.beginPath();
				m.distKeys.forEach(function (k, i) { if (i) ctx.lineTo(txp(k.t), dyp(k.x)); else ctx.moveTo(txp(k.t), dyp(k.x)); });
				ctx.stroke();
				ctx.globalAlpha = 1;
				m.evs.forEach(function (e) {
					if (e.reach == null) return;
					ctx.beginPath();
					ctx.arc(txp(e.t), dyp(e.reach), 2.6, 0, Math.PI * 2);
					ctx.fillStyle = e.kind === K.HIT ? (e.noReg ? NOREG_COLOR : TIERS[e.q].color) : e.kind === K.TAKEN ? col['--loss'] : col['--miss'];
					ctx.fill();
				});
			}
			ctx.strokeStyle = col['--accent2'];
			ctx.lineWidth = 1.5;
			ctx.beginPath(); ctx.moveTo(Math.round(txp(t)) + 0.5, top - 4); ctx.lineTo(Math.round(txp(t)) + 0.5, bottom + 4); ctx.stroke();
		}

		/**
		 * Event bursts around the current time. view.place(e) gives screen points for you and that event's
		 * opponent at the event; view.meNow is your current screen point; view.deathAt(e) places a death mark.
		 */
		function bursts(view, r, s) {
			// The last 1.5 s of events, but never more than MAX_BURSTS of them per frame.
			var from = Math.max(lowerBound(m.times, t - 1500), upperBound(m.times, t) - MAX_BURSTS);
			for (var i = from; i < m.evs.length && m.times[i] <= t; i++) {
				var e = m.evs[i], age = t - e.t;
				if (e.kind === K.DEATH) continue;
				var p = view.place(e);
				if (e.kind === K.HIT && age < 1000) {
					var c = e.noReg ? NOREG_COLOR : TIERS[e.q].color;
					var at = view.oppNow(e.opp) || p.opp;
					var k = age / 600;
					if (k < 1) {
						ctx.save();
						ctx.globalAlpha = 1 - k;
						ctx.strokeStyle = c;
						ctx.lineWidth = 3;
						ctx.beginPath();
						ctx.arc(at.x, at.y, r + 3 + ease(k) * Math.max(16, 0.9 * s), 0, Math.PI * 2);
						ctx.stroke();
						ctx.restore();
					}
					var text = e.noReg ? 'NO-REG' : reachQText(e.reachQ) + ' ' + TIERS[e.q].label;
					// Above the name label (which sits r + 5 above the disc), floating upwards.
					pill(at.x, at.y - r - 31 - ease(age / 1000) * 14, text, c, age < 750 ? 1 : 1 - (age - 750) / 250);
				} else if (e.kind === K.MISS && age < 520) {
					var km = age / 520;
					ctx.save();
					ctx.globalAlpha = 1 - km;
					ctx.setLineDash([4, 4]);
					ctx.strokeStyle = e.over ? col['--miss-over'] : col['--miss'];
					ctx.lineWidth = 2;
					ctx.beginPath();
					ctx.arc(view.meNow.x, view.meNow.y, r + 8 + ease(km) * Math.max(14, 0.6 * s), p.angle - 0.6, p.angle + 0.6);
					ctx.stroke();
					ctx.restore();
				} else if (e.kind === K.TAKEN && age < 650) {
					var kt = age / 650;
					ctx.save();
					ctx.globalAlpha = 1 - kt;
					ctx.strokeStyle = col['--loss'];
					ctx.lineWidth = 3;
					ctx.beginPath();
					ctx.arc(view.meNow.x, view.meNow.y, r + 3 + ease(kt) * Math.max(14, 0.75 * s), 0, Math.PI * 2);
					ctx.stroke();
					ctx.restore();
				} else if (e.kind === K.JUMP && age < 1000) {
					pill(view.meNow.x, view.meNow.y - r - 31 - ease(age / 1000) * 14, e.ok ? 'JR ✔' : 'JR ✘',
						e.ok ? col['--win'] : col['--loss'], age < 750 ? 1 : 1 - (age - 750) / 250);
				}
			}
			// Deaths stay marked once they happen.
			m.deaths.forEach(function (e) {
				if (e.t > t) return;
				var age = t - e.t;
				var pos = view.deathAt(e);
				if (!pos) return;
				var color = e.youDied ? col['--loss'] : col['--win'];
				cross(pos.x, pos.y, r * 0.9 * (0.6 + 0.4 * ease(age / 250)), color, Math.min(1, age / 120 + 0.2));
				if (age < 900) {
					ctx.save();
					ctx.globalAlpha = 1 - age / 900;
					ctx.strokeStyle = color;
					ctx.lineWidth = 3;
					ctx.beginPath();
					ctx.arc(pos.x, pos.y, r + 4 + ease(age / 900) * 26, 0, Math.PI * 2);
					ctx.stroke();
					ctx.restore();
				}
			});
		}

		function updateUi() {
			scrub.value = String(Math.round(t));
			timeEl.textContent = clockTime(Math.min(t, END)) + ' / ' + clockTime(END);
			var st = m.stateAt(t);
			comboEl.textContent = String(st.combo);
			streakEl.textContent = String(st.streak);
			playBtn.innerHTML = playing ? ICON_PAUSE : (t >= T ? ICON_RESTART : ICON_PLAY);
			playBtn.setAttribute('aria-label', playing ? 'Pause' : t >= T ? 'Replay from the start' : 'Play');
			if (api.onTime) api.onTime(t, playing);
		}
		function frame(now) {
			raf = 0;
			if (!playing) return;
			var dt = Math.min(100, now - lastFrame);
			lastFrame = now;
			t = Math.min(T, t + dt * speed);
			if (t >= T) playing = false;
			draw();
			updateUi();
			if (playing) raf = requestAnimationFrame(frame);
		}
		function play() {
			if (!m.evs.length) return;
			if (t >= T) { t = 0; snap = true; }
			playing = true;
			lastFrame = performance.now();
			if (!raf) raf = requestAnimationFrame(frame);
			updateUi();
		}
		function pause() {
			playing = false;
			if (raf) { cancelAnimationFrame(raf); raf = 0; }
			updateUi();
		}
		function seek(nt) {
			var jump = Math.abs(nt - t) > 400;
			t = clamp(nt, 0, T);
			if (jump) snap = true;
			draw();
			updateUi();
		}

		playBtn.addEventListener('click', function () { if (playing) pause(); else play(); });
		scrub.addEventListener('input', function () { seek(+scrub.value); });
		Array.prototype.forEach.call(speedBtns, function (b) {
			b.addEventListener('click', function () {
				speed = +b.getAttribute('data-speed');
				Array.prototype.forEach.call(speedBtns, function (o) { o.setAttribute('aria-pressed', String(o === b)); });
			});
		});
		canvas.addEventListener('keydown', function (ev) {
			if (ev.key === ' ' || ev.key === 'k' || ev.key === 'K') { ev.preventDefault(); if (playing) pause(); else play(); }
			else if (ev.key === 'ArrowRight') { ev.preventDefault(); seek(t + (ev.shiftKey ? 5000 : 1000)); }
			else if (ev.key === 'ArrowLeft') { ev.preventDefault(); seek(t - (ev.shiftKey ? 5000 : 1000)); }
			else if (ev.key === 'Home') { ev.preventDefault(); seek(0); }
			else if (ev.key === 'End') { ev.preventDefault(); seek(T); }
		});
		canvas.addEventListener('click', function () { if (m.evs.length) { if (playing) pause(); else play(); } });
		observeResize(stage, function () { resize(); draw(); });
		onCleanup(function () { playing = false; if (raf) cancelAnimationFrame(raf); });

		api.seek = seek;
		api.refreshTheme = refreshTheme;
		refreshTheme();
		updateUi();
		return api;
	}

	// ── Aim map ─────────────────────────────────────────────────────────────
	function aimHtml(m) {
		var s = m.sum, landed = s[S.LANDED];
		var BW = 108, BH = 324, MX = 0.27 * BW / 2, MY = 0.27 * BH / 2, PAD = 8;
		function ax(h) { return (BW / 2 + clamp(h, -1.27, 1.27) * BW / 2).toFixed(1); }
		function ay(v) { return (BH / 2 - clamp(v, -1.27, 1.27) * BH / 2).toFixed(1); }
		var svg = '<svg class="aim" viewBox="' + (-MX - PAD).toFixed(1) + ' ' + (-MY - PAD).toFixed(1) + ' ' + (BW + 2 * (MX + PAD)).toFixed(1) + ' ' + (BH + 2 * (MY + PAD)).toFixed(1) + '" role="img" aria-label="Aim map: where your swings met the opponent’s hitbox, front view">';
		svg += '<rect class="margin-box" x="' + (-MX).toFixed(1) + '" y="' + (-MY).toFixed(1) + '" width="' + (BW + 2 * MX).toFixed(1) + '" height="' + (BH + 2 * MY).toFixed(1) + '" rx="6"/>';
		svg += '<rect class="box" x="0" y="0" width="' + BW + '" height="' + BH + '" rx="4"/>';
		svg += '<line class="guide" x1="0" y1="' + BH / 3 + '" x2="' + BW + '" y2="' + BH / 3 + '"/>';
		svg += '<line class="guide" x1="0" y1="' + 2 * BH / 3 + '" x2="' + BW + '" y2="' + 2 * BH / 3 + '"/>';
		svg += '<line class="guide" x1="' + BW / 4 + '" y1="' + BH / 3 + '" x2="' + BW / 4 + '" y2="' + 2 * BH / 3 + '"/>';
		svg += '<line class="guide" x1="' + 3 * BW / 4 + '" y1="' + BH / 3 + '" x2="' + 3 * BW / 4 + '" y2="' + 2 * BH / 3 + '"/>';
		svg += '<text class="zl" x="' + BW / 2 + '" y="' + (BH / 6 + 4) + '" text-anchor="middle">HIGH</text>';
		svg += '<text class="zl" x="' + BW / 2 + '" y="' + (BH / 2 + 4) + '" text-anchor="middle">CENTER</text>';
		svg += '<text class="zl" x="' + BW / 2 + '" y="' + (5 * BH / 6 + 4) + '" text-anchor="middle">LOW</text>';
		var hits = 0, misses = 0;
		m.evs.forEach(function (e) {
			if (e.kind !== K.MISS) return;
			misses++;
			svg += '<circle class="miss" cx="' + ax(e.h) + '" cy="' + ay(e.v) + '" r="4"><title>Miss at ' + clockTime(e.t) + ', ' + reachQText(e.reachQ) + ' blocks</title></circle>';
		});
		m.evs.forEach(function (e) {
			if (e.kind !== K.HIT) return;
			hits++;
			var c = TIERS[e.q].color;
			var title = '<title>' + (e.noReg ? 'NO-REG ' : '') + TIERS[e.q].label + ' at ' + clockTime(e.t) + ', ' + reachQText(e.reachQ) + ' blocks, ' + ZONES[zoneOf(e.h, e.v)].toLowerCase() + '</title>';
			if (e.noReg) svg += '<circle cx="' + ax(e.h) + '" cy="' + ay(e.v) + '" r="4"' + strokeOf(NOREG_COLOR) + ' stroke-width="1.6">' + title + '</circle>';
			else svg += '<g><circle class="hit" cx="' + ax(e.h) + '" cy="' + ay(e.v) + '" r="4"' + fillOf(c) + '/><circle class="hit-edge" cx="' + ax(e.h) + '" cy="' + ay(e.v) + '" r="4"/>' + title + '</g>';
		});
		svg += '</svg>';
		var rows = [
			{ name: 'High', n: s[S.AIM_HIGH] }, { name: 'Center', n: s[S.AIM_CENTER] },
			{ name: 'Edge', n: s[S.AIM_EDGE] }, { name: 'Low', n: s[S.AIM_LOW] }
		];
		var maxN = Math.max(1, rows[0].n, rows[1].n, rows[2].n, rows[3].n);
		var zones = rows.map(function (z) {
			return '<div class="zrow"><span class="zn">' + z.name + '</span><span class="bar"><i style="width:' + (100 * z.n / maxN).toFixed(1) + '%"></i></span>' +
				'<span class="zv">' + z.n + '<small>' + pct(z.n, landed) + '</small></span></div>';
		}).join('');
		var thin = (m.downsampled && (hits + misses) > 0) ? '<p class="hint" style="margin-top:12px">Dots show the swings kept in this link; the zone counts use every landed hit.</p>' : '';
		return '<section class="sec rise" aria-labelledby="aim-h"><div class="sec-head"><h2 id="aim-h">Aim map</h2><p class="hint">Front view of a player hitbox</p></div>' +
			'<div class="panel"><div class="aim-wrap">' + svg + '<div class="zones">' + zones +
			'<div class="legend" style="margin:4px 0 0">' +
			'<span>' + markSvg('dot', TIERS[0].color) + 'Hit (tier colour)</span><span>' + markSvg('hollow', 'var(--miss)') + 'Miss</span></div>' +
			(hits + misses === 0 ? '<p class="hint">No swings in this link.</p>' : '') +
			'</div></div>' + thin + '</div></section>';
	}

	// ── Responsive SVG charts (re-rendered at the real width so text never scales) ──
	function mountResponsiveSvg(host, build) {
		function render() { host.innerHTML = build(Math.max(280, innerWidthOf(host))); }
		observeResize(host, render);
		render();
	}

	function histHtml(m) {
		return '<section class="sec rise" aria-labelledby="hist-h"><div class="sec-head"><h2 id="hist-h">Reach</h2><p class="hint">Eye to hitbox, per swing</p></div>' +
			'<div class="panel"><div class="legend"><span>' + markSvg('dot', 'var(--accent)') + 'Landed</span><span>' + markSvg('dot', 'var(--miss)') + 'Missed</span>' +
			'<span><svg viewBox="-7 -7 14 14" aria-hidden="true"><line x1="0" y1="-7" x2="0" y2="7" style="stroke:var(--accent2)" stroke-width="1.5" stroke-dasharray="3 2"/></svg>3-block threshold</span></div>' +
			'<div class="hist-host"></div></div></section>';
	}

	function histSvg(m, W) {
		var H = 214, L = 34, R = 10, TOP = 22, B = 30;
		var PW = W - L - R, PH = H - TOP - B;
		var NB = 17, slot = PW / NB;
		var landed = new Array(NB).fill(0), missed = new Array(NB).fill(0);
		var any = false;
		m.evs.forEach(function (e) {
			if ((e.kind !== K.HIT && e.kind !== K.MISS) || e.reachQ < 0) return;
			any = true;
			var q = e.reachQ;
			var idx = q < 60 ? 0 : q > 120 ? NB - 1 : 1 + Math.min(14, Math.floor((q - 60) / 4));
			if (e.kind === K.HIT) landed[idx]++; else missed[idx]++;
		});
		if (!any) return '<p class="empty-msg">No swings in this link.</p>';
		var maxN = 1;
		for (var i = 0; i < NB; i++) maxN = Math.max(maxN, landed[i] + missed[i]);
		var stepY = maxN <= 5 ? 1 : maxN <= 10 ? 2 : maxN <= 25 ? 5 : maxN <= 50 ? 10 : Math.ceil(maxN / 5 / 10) * 10;
		var top = Math.ceil(maxN / stepY) * stepY;
		function y(v) { return TOP + PH - v / top * PH; }
		var s = '<svg xmlns="' + SVGNS + '" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Reach histogram of landed and missed swings">';
		for (var g = 0; g <= top; g += stepY) {
			var gy = Math.round(y(g)) + 0.5;
			s += '<line class="' + (g === 0 ? 'axis' : 'grid') + '" x1="' + L + '" y1="' + gy + '" x2="' + (L + PW) + '" y2="' + gy + '"/>';
			s += '<text class="tick-label" x="' + (L - 6) + '" y="' + (gy + 3.5) + '" text-anchor="end">' + g + '</text>';
		}
		var bw = Math.min(24, Math.max(4, slot - 4));
		for (var b = 0; b < NB; b++) {
			var bx = L + b * slot + (slot - bw) / 2;
			var lo = b === 0 ? '<1.5' : b === NB - 1 ? '>3.0' : (1.4 + b / 10).toFixed(1) + '–' + (1.5 + b / 10).toFixed(1);
			var tipText = lo + ' blocks: ' + landed[b] + ' landed, ' + missed[b] + ' missed';
			var hL = landed[b] / top * PH, hM = missed[b] / top * PH;
			s += '<g><title>' + esc(tipText) + '</title>';
			s += '<rect x="' + bx.toFixed(1) + '" y="' + TOP + '" width="' + bw.toFixed(1) + '" height="' + PH + '" fill="transparent"/>';
			if (landed[b]) s += '<rect class="landed" x="' + bx.toFixed(1) + '" y="' + (y(landed[b])).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + Math.max(1, hL).toFixed(1) + '" rx="2"/>';
			if (missed[b]) s += '<rect class="missed" x="' + bx.toFixed(1) + '" y="' + (y(landed[b] + missed[b])).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + Math.max(1, hM - (landed[b] ? 2 : 0)).toFixed(1) + '" rx="2"/>';
			s += '</g>';
		}
		// Boundary labels (1.5 … 3.0) under the bin edges, plus the two open bins. The 1.5 and 3.0 edges sit
		// half a slot from "<1.5" and ">3.0", so they are labelled only when the slots are wide enough.
		var roomy = slot >= 40;
		s += '<text class="tick-label" x="' + (L + slot / 2).toFixed(1) + '" y="' + (H - 10) + '" text-anchor="middle">&lt;1.5</text>';
		s += '<text class="tick-label" x="' + (L + (NB - 0.5) * slot).toFixed(1) + '" y="' + (H - 10) + '" text-anchor="middle">&gt;3.0</text>';
		for (var k = 0; k <= 15; k++) {
			var ex = L + (k + 1) * slot;
			s += '<line class="axis" x1="' + ex.toFixed(1) + '" y1="' + (TOP + PH) + '" x2="' + ex.toFixed(1) + '" y2="' + (TOP + PH + (k % 5 === 0 ? 5 : 3)) + '"/>';
			var labelled = roomy ? true : (k === 5 || k === 10);
			if (labelled) s += '<text class="tick-label" x="' + ex.toFixed(1) + '" y="' + (H - 10) + '" text-anchor="middle">' + (1.5 + k / 10).toFixed(1) + '</text>';
		}
		var thr = m.d.threeBlockCm / 100;
		if (thr >= 1.5 && thr <= 3.0) {
			var tx = L + slot + (thr - 1.5) / 0.1 * slot;
			s += '<line class="thr" x1="' + tx.toFixed(1) + '" y1="' + (TOP - 8) + '" x2="' + tx.toFixed(1) + '" y2="' + (TOP + PH) + '"/>';
			s += '<text class="thr-label" x="' + (tx - 5).toFixed(1) + '" y="' + (TOP - 10) + '" text-anchor="end">3-block ≥ ' + cmText(m.d.threeBlockCm) + '</text>';
		}
		return s + '</svg>';
	}

	// ── Quality breakdown and jump resets ───────────────────────────────────
	function qualityHtml(m) {
		var s = m.sum, landed = s[S.LANDED];
		var counts = TIERS.map(function (_, i) { return s[S.QUALITY + i]; });
		var maxN = Math.max.apply(null, [1].concat(counts));
		var rows = TIERS.map(function (tier, i) {
			return '<div class="qrow"><span class="ql"><i style="--c:' + tier.color + '"></i>' + tier.label + '</span>' +
				'<span class="bar"><i style="width:' + (100 * counts[i] / maxN).toFixed(1) + '%;--c:' + tier.color + '"></i></span>' +
				'<span class="qn">' + counts[i] + '</span><span class="qp">' + pct(counts[i], landed) + '</span></div>';
		}).join('');
		return '<section class="sec rise" aria-labelledby="q-h"><div class="sec-head"><h2 id="q-h">Hit quality</h2><p class="hint">' +
			(landed ? plural(landed, 'landed hit') + (s[S.NOREG] ? ' · ' + s[S.NOREG] + ' NO-REG' : '') : 'No hits landed') + '</p></div>' +
			'<div class="panel"><div class="qrows">' + rows + '</div></div></section>';
	}

	function jumpsHtml(m) {
		var s = m.sum;
		var nonEarly = m.evs.filter(function (e) { return e.kind === K.JUMP && !e.early; });
		var avg = nonEarly.length ? Math.round(nonEarly.reduce(function (a, e) { return a + e.deltaMs; }, 0) / nonEarly.length) : null;
		var chips = '<span class="chip"><b>' + s[S.J_OK] + '</b> / ' + s[S.J_ATT] + ' in the window</span>' +
			'<span class="chip"><b>' + s[S.J_EARLY] + '</b> early</span>' +
			'<span class="chip"><b>' + s[S.J_OPP] + '</b> chances</span>' +
			(avg !== null ? '<span class="chip">avg <b>' + signed(avg) + '</b> ms</span>' : '');
		return '<section class="sec rise" aria-labelledby="j-h"><div class="sec-head"><h2 id="j-h">Jump resets</h2><p class="hint">Game time after the hit; one tick is 50 ms</p></div>' +
			'<div class="panel"><div class="jsum">' + chips + '</div><div class="jump-host"></div></div></section>';
	}

	function jumpSvg(m, W) {
		var d = m.d;
		// Axis half-width; bounded (validate also caps it) so the 50 ms tick loop below stays at most 41 ticks.
		var A = clamp(d.jumpAttemptMs, 100, 1000);
		var jumps = m.evs.filter(function (e) { return e.kind === K.JUMP; });
		if (!jumps.length) return '<p class="empty-msg">No jump-reset attempts in this link.</p>';
		var stacks = {};
		var maxStack = 1;
		jumps.forEach(function (e) {
			var key = clamp(Math.round(e.deltaMs / 50) * 50, -A, A);
			(stacks[key] = stacks[key] || []).push(e);
			maxStack = Math.max(maxStack, stacks[key].length);
		});
		var L = 18, R = 18, ROW = 15, TOP = 30;
		var H = TOP + Math.min(maxStack, 8) * ROW + 44;
		var base = H - 40;
		var PW = W - L - R;
		function x(ms) { return L + (ms + A) / (2 * A) * PW; }
		var s = '<svg xmlns="' + SVGNS + '" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Jump-reset timing strip">';
		if (d.jumpMinMs <= d.jumpMaxMs) {
			var bx0 = x(clamp(d.jumpMinMs, -A, A)), bx1 = x(clamp(d.jumpMaxMs, -A, A));
			var bw = Math.max(3, bx1 - bx0);
			s += '<rect class="band" x="' + (bx0 - (bw === 3 ? 1.5 : 0)).toFixed(1) + '" y="' + (TOP - 14) + '" width="' + bw.toFixed(1) + '" height="' + (base - TOP + 14) + '" rx="3"/>';
			s += '<text class="region" x="' + ((bx0 + bx1) / 2).toFixed(1) + '" y="' + (TOP - 18) + '" text-anchor="middle">WINDOW</text>';
		}
		s += '<text class="region" x="' + x(-A / 2).toFixed(1) + '" y="' + (TOP - 18) + '" text-anchor="middle">EARLY</text>';
		s += '<text class="region" x="' + x(Math.min(A, Math.max(d.jumpMaxMs + 50, A * 0.65))).toFixed(1) + '" y="' + (TOP - 18) + '" text-anchor="middle">LATE</text>';
		s += '<line class="axis" x1="' + L + '" y1="' + (base + 0.5) + '" x2="' + (L + PW) + '" y2="' + (base + 0.5) + '"/>';
		var pxPer50 = PW / (2 * A) * 50;
		var labelEvery = pxPer50 >= 34 ? 50 : pxPer50 >= 17 ? 100 : 200;
		for (var ms = -Math.floor(A / 50) * 50; ms <= A; ms += 50) {
			var tx = Math.round(x(ms)) + 0.5;
			s += '<line class="' + (ms === 0 ? 'zero' : 'axis') + '" x1="' + tx + '" y1="' + (base - (ms === 0 ? base - TOP + 14 : 0)) + '" x2="' + tx + '" y2="' + (base + (ms % 100 === 0 ? 6 : 4)) + '"/>';
			if (ms % labelEvery === 0) s += '<text class="tick-label" x="' + tx + '" y="' + (base + 19) + '" text-anchor="middle">' + signed(ms) + '</text>';
		}
		s += '<text class="tick-label" x="' + (L + PW) + '" y="' + (base + 33) + '" text-anchor="end">ms</text>';
		Object.keys(stacks).forEach(function (key) {
			var list = stacks[key];
			var cx = x(+key);
			list.forEach(function (e, i) {
				if (i >= 8) return;
				var cy = base - 9 - i * ROW;
				var title = '<title>' + (e.ok ? 'Reset' : e.early ? 'Early' : 'Late') + ' ' + signed(e.deltaMs) + ' ms at ' + clockTime(e.t) + '</title>';
				s += '<g transform="translate(' + cx.toFixed(1) + ',' + cy + ')">' + title + '<circle r="6.5" class="' + (e.ok ? 'ok' : 'bad') + '"/>' +
					(e.ok ? '<path class="glyph" d="M-3.2 0l2.1 2.3 4.3-4.4"/>' : '<path class="glyph" d="M-2.5-2.5l5 5M2.5-2.5l-5 5"/>') + '</g>';
			});
			if (list.length > 8) s += '<text class="tick-label" x="' + cx.toFixed(1) + '" y="' + (base - 9 - 8 * ROW + 4) + '" text-anchor="middle">+' + (list.length - 8) + '</text>';
		});
		return s + '</svg>';
	}

	// ── Theme toggle and boot ───────────────────────────────────────────────
	var themeBtn = document.getElementById('theme-btn');
	function syncThemeButton() {
		var light = root.getAttribute('data-theme') === 'light';
		themeBtn.setAttribute('aria-label', light ? 'Switch to dark theme' : 'Switch to light theme');
	}
	themeBtn.addEventListener('click', function () {
		var next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
		root.setAttribute('data-theme', next);
		try { localStorage.setItem('kwamster-theme', next); } catch (e) { /* storage blocked */ }
		syncThemeButton();
		var ev;
		try { ev = new Event('kw-theme'); } catch (e) { ev = document.createEvent('Event'); ev.initEvent('kw-theme', false, false); }
		window.dispatchEvent(ev);
	});
	syncThemeButton();

	function boot() {
		teardown();
		var token = ++bootToken;
		var frag = location.hash.replace(/^#/, '').trim();
		if (!KD || !KD.isSupported()) { renderUnsupported(); return; }
		if (!frag) { renderLanding(); return; }
		app.setAttribute('aria-busy', 'true');
		KD.decodeFragment(frag).then(function (d) {
			if (token !== bootToken) return;
			// Refuse numbers no KWAMSTER build writes before drawing anything (a crafted link must not freeze the tab).
			var problem = KD.validate(d);
			if (problem) {
				renderMessage('bad', 'This link could not be read',
					'<p>The link decoded, but it holds numbers far outside anything KWAMSTER records, so it was not drawn. It was damaged, edited, or not made by KWAMSTER.</p>' +
					'<p>Ask for the link again, ideally copied with <b>[Copy link]</b> in game and pasted in full.</p>',
					'Out of range: ' + problem, true);
				return;
			}
			try {
				renderFight(d);
				window.scrollTo(0, 0);
			} catch (err) {
				teardown();
				renderMessage('bad', 'This fight could not be drawn',
					'<p>The link decoded, but the page failed while drawing it. Please report this together with the link.</p>',
					err && err.stack ? String(err.stack).split('\n').slice(0, 3).join(' | ') : String(err), true);
			}
		}, function (err) {
			if (token !== bootToken) return;
			renderError(err);
		});
	}
	window.addEventListener('hashchange', boot);
	boot();
})();
</script>
</body>
</html>
